name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle test

      - name: Build mod
        run: gradle build

      - name: Upload development build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iris-config-search-dev-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
