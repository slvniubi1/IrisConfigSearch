name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run tests
        run: gradle test

      - name: Build release JAR
        run: gradle build

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then VERSION="${{ inputs.tag }}"; fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p release
          cp build/libs/*.jar release/
          cat > release/RELEASE_NOTES.md <<EOF
          # Iris Config Search ${VERSION}

          ## Features
          - Search active shader-pack options exposed by NeOculus.
          - Filter by option type and default enabled state.
          - View option descriptions, current values, and default values when available.
          - English and Simplified Chinese interface.

          ## Requirements
          - Minecraft 1.21.1
          - NeoForge 21.1.x
          - Java 21
          - NeOculus with a compatible active shader pack for live option discovery.

          ## Limitations
          This is an initial read-only release. Editing options, saving changes, and runtime compatibility across all NeOculus versions are not guaranteed. Review the README before installing.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Iris Config Search ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: release/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
